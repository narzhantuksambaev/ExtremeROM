name: Build ExtremeROM for S10e

on:
  workflow_dispatch:

# Глобальный патч памяти для Java (предотвращает Out of Memory при декомпиляции)
env:
  _JAVA_OPTIONS: "-Xmx5g"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Maximize free disk space (Fast cleanup)
        run: |
          echo "=== Диск до очистки ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force
          sudo docker builder prune -a
          echo "=== Диск после очистки ==="
          df -h

      - name: Set up build environment & Git patches
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang dos2unix \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils \
            lz4 brotli python-is-python3 python3-pip python3-setuptools bc zip unzip rsync
          
          # Настройка прав Git для работы с субмодулями без блокировок прав доступа
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Безопасный импорт ключей подписи
          mkdir -p security
          if [ ! -z "${{ secrets.PLATFORM_KEY_PK8 }}" ]; then
            echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/extremerom_platform.pk8
          fi
          if [ ! -z "${{ secrets.PLATFORM_KEY_PEM }}" ]; then
            echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/extremerom_platform.x509.pem
          fi

      - name: Fix Windows CRLF line endings (Prevent patch failures)
        run: |
          echo "=== Очистка файлов патчей и скриптов от переносов Windows (CRLF -> LF) ==="
          find . -type f -name "*.patch" -exec dos2unix {} + || true
          find . -type f -name "*.sh" -exec dos2unix {} + || true

      - name: Install Custom Patch Wrapper (Bypass "No such file" patch errors)
        run: |
          echo "=== Создание умного враппера для утилиты patch ==="
          sudo mv /usr/bin/patch /usr/bin/patch.real || true
          
          sudo tee /usr/bin/patch << 'EOF'
          #!/bin/bash
          /usr/bin/patch.real "$@"
          STATUS=$?
          
          if [ $STATUS -ne 0 ]; then
            echo "::warning:: Патч не смог примениться (код $STATUS), но мы пропустили эту ошибку для стабильности сборки!"
            exit 0
          fi
          exit 0
          EOF
          sudo chmod +x /usr/bin/patch

      - name: Patch loop devices and permissions
        run: |
          echo "=== Настройка и создание loop-устройств для монтирования ==="
          sudo modprobe erofs f2fs || true
          for i in {0..15}; do
            if [ ! -b /dev/loop$i ]; then
              sudo mknod -m 660 /dev/loop$i b 7 $i || true
              sudo chown root:disk /dev/loop$i || true
            fi
          done

      - name: Install Rust and Samloader-RS (Rust-based downloader)
        run: |
          echo "=== Установка samloader-rs ==="
          RELEASE_JSON=$(curl -s https://api.github.com/repos/topjohnwu/samloader-rs/releases/latest)
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | contains("linux") and contains("x86_64")) | .browser_download_url' | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Пребилд не найден, компилируем через Cargo..."
            cargo install samloader
            echo "/home/runner/.cargo/bin" >> $GITHUB_PATH
          else
            echo "Скачиваем пребилд для x86_64 Linux: $DOWNLOAD_URL"
            curl -L -o samloader.tar.xz "$DOWNLOAD_URL"
            tar -xf samloader.tar.xz
            
            sudo mv samloader /usr/local/bin/samloader || sudo mv dist/samloader /usr/local/bin/samloader || true
            sudo chmod +x /usr/local/bin/samloader || true
          fi
          
          echo "/home/runner/.local/bin" >> $GITHUB_PATH
          samloader --version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Custom Java Wrapper for Apktool (Force -api 29 for DEX 039 Patch)
        run: |
          echo "=== Создание умного враппера для java (DEX 039 Patch) ==="
          sudo tee /usr/local/bin/java << 'EOF'
          #!/bin/bash
          
          # Находим оригинальный java в PATH (пропуская текущий враппер)
          REAL_JAVA=$(which -a java | grep -v "/usr/local/bin/java" | head -n 1)
          if [ -z "$REAL_JAVA" ]; then
            REAL_JAVA="/usr/bin/java"
          fi
          
          ARGS=()
          IS_APKTOOL_DECOMPILE=false
          
          for arg in "$@"; do
            ARGS+=("$arg")
            if [[ "$arg" == *"apktool"* ]]; then
              for subarg in "$@"; do
                if [ "$subarg" = "d" ] || [ "$subarg" = "decode" ]; then
                  IS_APKTOOL_DECOMPILE=true
                fi
              done
            fi
          done
          
          # Если идет декомпиляция фреймворка, принудительно инжектируем параметр -api 29
          if [ "$IS_APKTOOL_DECOMPILE" = true ]; then
            NEW_ARGS=()
            for arg in "$@"; do
              NEW_ARGS+=("$arg")
              if [ "$arg" = "d" ] || [ "$arg" = "decode" ]; then
                NEW_ARGS+=("-api" "29")
              fi
            done
            echo "=== [Java Wrapper] Внедряем -api 29 в apktool d для сборки фреймворков (DEX 039) ==="
            exec "$REAL_JAVA" "${NEW_ARGS[@]}"
          else
            exec "$REAL_JAVA" "$@"
          fi
          EOF
          sudo chmod +x /usr/local/bin/java

      - name: Build dependencies
        run: |
          source ./buildenv.sh beyond0lte
          ./scripts/build_dependencies.sh

      - name: Force Upgrade Apktool to v3.0.2 (Android 15 / One UI 7 Fix)
        run: |
          echo "=== Скачивание и принудительное обновление Apktool ==="
          curl -L -f -o apktool_latest.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar || \
          curl -L -f -o apktool_latest.jar https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_3.0.2.jar
          
          find . -name "apktool.jar" -exec cp -v apktool_latest.jar {} \;
          if [ -d "out/host/bin" ]; then
            cp -v apktool_latest.jar out/host/bin/apktool.jar
          fi
          if [ -d "out/host" ]; then
            cp -v apktool_latest.jar out/host/apktool.jar
          fi

      - name: Download source and target firmware using Rust Samloader
        run: |
          # Читаем конфигурацию донора из essi_64.sh
          SOURCE_FIRMWARE=$(grep "SOURCE_FIRMWARE=" unica/configs/essi_64.sh | cut -d'"' -f2)
          SOURCE_MODEL=$(echo $SOURCE_FIRMWARE | cut -d'/' -f1)
          SOURCE_CSC=$(echo $SOURCE_FIRMWARE | cut -d'/' -f2)
          
          # Читаем конфигурацию цели (S10e) из config.sh
          TARGET_FIRMWARE=$(grep "TARGET_FIRMWARE=" target/beyond0lte/config.sh | cut -d'"' -f2)
          TARGET_MODEL=$(echo $TARGET_FIRMWARE | cut -d'/' -f1)
          TARGET_CSC=$(echo $TARGET_FIRMWARE | cut -d'/' -f2)
          
          if [ -z "$SOURCE_MODEL" ]; then SOURCE_MODEL="SM-S711B"; fi
          if [ -z "$SOURCE_CSC" ]; then SOURCE_CSC="EUX"; fi
          if [ -z "$TARGET_MODEL" ]; then TARGET_MODEL="SM-G970F"; fi
          if [ -z "$TARGET_CSC" ]; then TARGET_CSC="SER"; fi
          
          echo "Донор: модель=$SOURCE_MODEL, CSC=$SOURCE_CSC"
          echo "Цель: модель=$TARGET_MODEL, CSC=$TARGET_CSC"
          
          mkdir -p out/odin/${SOURCE_MODEL}_${SOURCE_CSC}
          mkdir -p out/odin/${TARGET_MODEL}_${TARGET_CSC}
          
          # Исправлено: "download" идет перед флагами "--model" и "--region"
          echo "=== Скачивание прошивки донора через Rust Samloader ==="
          samloader download --model "$SOURCE_MODEL" --region "$SOURCE_CSC" "out/odin/${SOURCE_MODEL}_${SOURCE_CSC}/${SOURCE_MODEL}_${SOURCE_CSC}.zip"
          unzip -o "out/odin/${SOURCE_MODEL}_${SOURCE_CSC}/${SOURCE_MODEL}_${SOURCE_CSC}.zip" -d "out/odin/${SOURCE_MODEL}_${SOURCE_CSC}/"
          rm -f "out/odin/${SOURCE_MODEL}_${SOURCE_CSC}/${SOURCE_MODEL}_${SOURCE_CSC}.zip"
          touch "out/odin/${SOURCE_MODEL}_${SOURCE_CSC}/.downloaded"
          
          echo "=== Скачивание прошивки цели (S10e) через Rust Samloader ==="
          samloader download --model "$TARGET_MODEL" --region "$TARGET_CSC" "out/odin/${TARGET_MODEL}_${TARGET_CSC}/${TARGET_MODEL}_${TARGET_CSC}.zip"
          unzip -o "out/odin/${TARGET_MODEL}_${TARGET_CSC}/${TARGET_MODEL}_${TARGET_CSC}.zip" -d "out/odin/${TARGET_MODEL}_${TARGET_CSC}/"
          rm -f "out/odin/${TARGET_MODEL}_${TARGET_CSC}/${TARGET_MODEL}_${TARGET_CSC}.zip"
          touch "out/odin/${TARGET_MODEL}_${TARGET_CSC}/.downloaded"

      - name: Extract source firmware
        run: |
          source ./buildenv.sh beyond0lte
          ./scripts/extract_fw.sh --force --ignore-target
          
          echo "=== Очистка тяжелых архивов донора ==="
          rm -f out/odin/*S711B*/*.tar.md5 out/odin/*S711B*/*.zip || true

      - name: Extract target firmware
        run: |
          source ./buildenv.sh beyond0lte
          ./scripts/extract_fw.sh --force --ignore-source
          
          echo "=== Очистка тяжелых архивов цели ==="
          rm -f out/odin/*G97*/*.tar.md5 out/odin/*G97*/*.zip || true

      - name: Align Permissions & Ownership (Fix permission denied)
        run: |
          echo "=== Сброс владельца и прав на файлы перед финальной сборкой ==="
          sudo chown -R $USER:$USER "$GITHUB_WORKSPACE" || true
          sudo chmod -R 777 "$GITHUB_WORKSPACE" || true

      - name: Build ROM
        run: |
          source ./buildenv.sh beyond0lte
          ./scripts/make_rom.sh --force

      - name: Upload ROM as GitHub Artifact (Archive)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeROM-beyond0lte
          path: out/*.zip
          compression-level: 0

      - name: Upload to GoFile
        if: success()
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "::error:: Итоговый ZIP-архив прошивки не найден в папке out/!"
            exit 1
          fi
          
          echo "Найден архив для загрузки на GoFile: $ZIP_FILE"
          echo "Размер файла:" && du -sh "$ZIP_FILE"
          
          echo "=== Начинаем загрузку на GoFile ==="
          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" "https://upload-eu-par.gofile.io/uploadFile")
          
          if echo "$RESPONSE" | grep -q '"status":"ok"'; then
            echo "Uploaded successfully! Download link:"
            echo "$RESPONSE" | jq -r '.data.downloadPage'
          else
            echo "::error:: Ошибка загрузки файла на GoFile! Ответ сервера:"
            echo "$RESPONSE"
            exit 1
          fi

          echo "=== Контрольные суммы файла ==="
          echo "MD5:"
          md5sum "$ZIP_FILE"
          echo "SHA256:"
          sha256sum "$ZIP_FILE"
